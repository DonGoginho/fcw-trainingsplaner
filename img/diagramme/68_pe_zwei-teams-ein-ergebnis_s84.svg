<rect x="50" y="470" width="700" height="82" rx="4" fill="#F5F5F5" stroke="#DDD"/>
<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">2 Spielfelder (gross/klein) mit je 2 Toren. Zwei Mannschaften bilden, die sich selbstständig</text><text x="62" y="517" font-size="9.5" fill="#555">in je eine grosse (6 bis 8 Spieler) und eine kleine (3 bis 4 Spieler) Mannschaft aufteilen.</text><text x="62" y="531" font-size="9.5" fill="#555">Die Ergebnisse aus beiden Spielen werden zusammengezählt. Je 2 Kapitäne halten die anderen auf dem Laufenden.</text><text x="62" y="545" font-size="9.5" fill="#555">Nach jedem Durchgang unterhalten sich die Mannschaften und können die Teams neu bilden. 3 bis 5 Minuten pro Durchgang.</text>
