<text x="62" y="503" font-size="9.5" fill="#555">Team A (rot) verteidigt das grosse Tor, Team B (weiss) die drei Pylonentore.</text><text x="62" y="517" font-size="9.5" fill="#555">Gelingt es den Spieler von Team A, den Ball durch eines der Pylonentore zu führen, gibt es einen Rollentausch.</text>
