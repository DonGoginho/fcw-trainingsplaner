<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">Je ein Spieler jeder Mannschaft dribbelt den Ball (1), stoppt ihn auf der Linie, sprintet um das Hütchen (2),</text><text x="62" y="517" font-size="9.5" fill="#555">nimmt den Ball wieder mit und dribbelt durch das Pylonentor (3). 1 Punkt pro Durchgang für das Siegerteam.</text><text x="62" y="531" font-size="9.5" fill="#555">Varianten: Den Ball für den nächsten Spieler stoppen (Stafette) · Abschnitte mit und ohne Ball tauschen.</text>
