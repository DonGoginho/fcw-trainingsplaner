<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter, sans-serif">
  <title>Isoliert: Explosive Antrittsübungen</title>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Isoliert: Explosive Antrittsübungen</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#555">Explosivität · Manual S. 74 · «Fallender Start»</text>

  <!-- Boden -->
  <rect x="60" y="55" width="400" height="220" rx="2" fill="#4a8f3f" stroke="#fff" stroke-width="2"/>

  <!-- Startlinie -->
  <line x1="120" y1="60" x2="120" y2="270" stroke="#fff" stroke-width="2"/>
  <text x="110" y="165" text-anchor="end" font-size="8" fill="#fff" transform="rotate(-90,110,165)">Start</text>

  <!-- Ziellinie -->
  <line x1="400" y1="60" x2="400" y2="270" stroke="#fff" stroke-width="2"/>
  <text x="410" y="165" font-size="8" fill="#fff" transform="rotate(-90,410,165)">Ziel</text>

  <!-- Sprintdistanz -->
  <line x1="140" y1="55" x2="380" y2="55" stroke="#fff" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="260" y="52" text-anchor="middle" font-size="7" fill="#fff">10–15 m Sprint</text>

  <!-- Spieler 1: Fallender Start -->
  <circle cx="125" cy="100" r="12" fill="#e74c3c" stroke="#fff" stroke-width="1.5"/>
  <text x="125" y="104" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">1</text>
  <line x1="137" y1="100" x2="390" y2="100" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="390,97 396,100 390,103" fill="#e74c3c"/>
  <text x="200" y="92" font-size="7" fill="#fff">Fallender Start → Sprint</text>

  <!-- Spieler 2: Kniende Position -->
  <circle cx="125" cy="165" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="125" y="169" text-anchor="middle" font-size="8" fill="#333" font-weight="700">2</text>
  <line x1="137" y1="165" x2="390" y2="165" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="390,162 396,165 390,168" fill="#555"/>
  <text x="200" y="157" font-size="7" fill="#fff">Kniende Position → Sprint</text>

  <!-- Spieler 3: Liegende Position -->
  <circle cx="125" cy="230" r="12" fill="#e74c3c" stroke="#fff" stroke-width="1.5"/>
  <text x="125" y="234" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">3</text>
  <line x1="137" y1="230" x2="390" y2="230" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="390,227 396,230 390,233" fill="#e74c3c"/>
  <text x="200" y="222" font-size="7" fill="#fff">Liegende Position → Sprint</text>

  <!-- Coaching-Punkte -->
  <rect x="60" y="285" width="400" height="85" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="70" y="302" font-size="9" fill="#333" font-weight="600">Coaching-Punkte:</text>
  <text x="70" y="317" font-size="9" fill="#555">• Bodenkontakt auf Vorderfuss</text>
  <text x="70" y="332" font-size="9" fill="#555">• Aktiver Armeinsatz</text>
  <text x="70" y="347" font-size="9" fill="#555">• Dynamisch nach oben und nach vorne stossen</text>
  <text x="70" y="362" font-size="9" fill="#555">• Erholung: 10- bis 20-fache Belastungsdauer</text>
</svg>