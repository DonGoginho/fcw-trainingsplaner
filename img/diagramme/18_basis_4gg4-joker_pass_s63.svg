<text x="62" y="503" font-size="9.5" fill="#555">4 gegen 4 mit 2 Jokern in der Mittelzone eines Feldes von 50 × 40 Meter mit 2 Toren und 2 Torhüter.</text><text x="62" y="517" font-size="9.5" fill="#555">Der Angreifer muss mittels Pass in die Angriffszone angespielt werden, um ein Tor zu erzielen.</text>
