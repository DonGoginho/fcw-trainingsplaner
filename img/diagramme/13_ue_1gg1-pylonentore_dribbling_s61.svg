<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">1 – A spielt B an und setzt ihn sofort unter Druck (2').</text><text x="62" y="517" font-size="9.5" fill="#555">B versucht, über die Mittellinie zu gelangen und durch eines der beiden orangen Pylonentore zu dribbeln (2).</text><text x="62" y="531" font-size="9.5" fill="#555">Erobert A den Ball, dribbelt er durch die gelben Pylonentore.</text>
