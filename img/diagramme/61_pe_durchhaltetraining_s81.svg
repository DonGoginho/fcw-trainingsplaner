<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">3 Angreifer haben 10 Bälle zur Verfügung und sollen möglichst viele Tore erzielen.</text><text x="62" y="517" font-size="9.5" fill="#555">1 Verteidiger schirmt das Tor ab. Erobert dieser den Ball, versucht er ihn in eines der beiden gegenüberliegenden Tore zu spielen.</text><text x="62" y="531" font-size="9.5" fill="#555">Niemand darf die markierte Zone vor dem Tor betreten. Zeit stoppen, die der Verteidiger durchhält.</text><text x="62" y="545" font-size="9.5" fill="#555">Dauer: ca. 30 bis 90 Sekunden pro Sequenz.</text>
