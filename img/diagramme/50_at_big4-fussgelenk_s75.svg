<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Inter, sans-serif">
  <title>Big 4 – Bereich 1: Fussgelenk</title>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Big 4 – Bereich 1: Fussgelenk</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#555">Körperstabilität · Manual S. 75</text>

  <!-- Hintergrund -->
  <rect x="40" y="55" width="440" height="290" rx="6" fill="#e8f5e9" stroke="#4a8f3f" stroke-width="1.5"/>

  <!-- Variante 1: Beidbeinig -->
  <rect x="55" y="70" width="125" height="130" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="118" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Variante 1</text>
  <text x="118" y="100" text-anchor="middle" font-size="8" fill="#555">Beidbeinig</text>
  <!-- Stilisierte Figur -->
  <circle cx="118" cy="125" r="8" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="118" y1="133" x2="118" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <line x1="118" y1="160" x2="108" y2="178" stroke="#e74c3c" stroke-width="2"/>
  <line x1="118" y1="160" x2="128" y2="178" stroke="#e74c3c" stroke-width="2"/>
  <!-- Pfeile hoch/runter bei Fersen -->
  <line x1="100" y1="180" x2="100" y2="170" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="97,170 100,164 103,170" fill="#2980b9"/>
  <line x1="136" y1="180" x2="136" y2="170" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="133,170 136,164 139,170" fill="#2980b9"/>
  <text x="118" y="196" text-anchor="middle" font-size="7" fill="#555">Fersen heben</text>
  <text x="118" y="205" text-anchor="middle" font-size="7" fill="#555">und senken</text>

  <!-- Variante 2: Einbeinig -->
  <rect x="195" y="70" width="125" height="130" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="258" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Variante 2</text>
  <text x="258" y="100" text-anchor="middle" font-size="8" fill="#555">Einbeinig</text>
  <circle cx="258" cy="125" r="8" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="258" y1="133" x2="258" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <line x1="258" y1="160" x2="258" y2="180" stroke="#e74c3c" stroke-width="2"/>
  <line x1="258" y1="160" x2="270" y2="170" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="248" y1="180" x2="248" y2="170" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="245,170 248,164 251,170" fill="#2980b9"/>
  <text x="258" y="196" text-anchor="middle" font-size="7" fill="#555">Gleiche Übung</text>
  <text x="258" y="205" text-anchor="middle" font-size="7" fill="#555">einbeinig</text>

  <!-- Variante 3: Mit Ball -->
  <rect x="335" y="70" width="130" height="130" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="400" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Variante 3</text>
  <text x="400" y="100" text-anchor="middle" font-size="8" fill="#555">Mit Ball</text>
  <circle cx="400" cy="125" r="8" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="400" y1="133" x2="400" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <line x1="400" y1="160" x2="390" y2="178" stroke="#e74c3c" stroke-width="2"/>
  <line x1="400" y1="160" x2="410" y2="178" stroke="#e74c3c" stroke-width="2"/>
  <!-- Ball über Kopf -->
  <circle cx="400" cy="112" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
  <line x1="390" y1="145" x2="400" y2="115" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="410" y1="145" x2="400" y2="115" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="400" y="196" text-anchor="middle" font-size="7" fill="#555">Ball vor Brust,</text>
  <text x="400" y="205" text-anchor="middle" font-size="7" fill="#555">über Kopf etc.</text>

  <!-- Coaching-Punkte -->
  <rect x="55" y="215" width="410" height="120" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="65" y="235" font-size="9" fill="#333" font-weight="600">Ausführung:</text>
  <text x="65" y="252" font-size="9" fill="#555">• Füsse schulterbreit auseinander, Blick nach vorne gerichtet</text>
  <text x="65" y="267" font-size="9" fill="#555">• Fersen vom Boden abheben und senken, Kopf oben halten</text>
  <text x="65" y="282" font-size="9" fill="#555">• Zeitvorgaben statt Wiederholungen (z.B. 30 Sek. pro Serie)</text>
  <text x="65" y="297" font-size="9" fill="#555">• Qualität der Ausführung beachten</text>
  <text x="65" y="315" font-size="9" fill="#333" font-weight="600">Ziel: Fussgelenkstabilität verbessern, Verletzungen vorbeugen</text>

  <!-- Bereich-Label -->
  <rect x="40" y="355" width="440" height="30" rx="4" fill="#4a8f3f"/>
  <text x="260" y="375" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Körperstabilität – ins Aufwärmen integrieren</text>
</svg>