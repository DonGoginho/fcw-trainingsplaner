<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Inter, sans-serif">
  <title>Big 4 – Bereich 2: Knie</title>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Big 4 – Bereich 2: Knie</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#555">Körperstabilität · Manual S. 76 · Ausfallschritt + Rumpfrotation</text>

  <!-- Hintergrund -->
  <rect x="40" y="55" width="440" height="240" rx="6" fill="#e8f5e9" stroke="#4a8f3f" stroke-width="1.5"/>

  <!-- Phase 1: Ausfallschritt -->
  <rect x="55" y="70" width="200" height="160" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="155" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Phase 1: Ausfallschritt</text>
  <!-- Stilisierte Figur im Ausfallschritt -->
  <circle cx="155" cy="115" r="10" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="155" y1="125" x2="155" y2="160" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Vorderes Bein (90°) -->
  <line x1="155" y1="160" x2="130" y2="185" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="130" y1="185" x2="130" y2="210" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Hinteres Bein -->
  <line x1="155" y1="160" x2="185" y2="190" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="185" y1="190" x2="195" y2="210" stroke="#e74c3c" stroke-width="2"/>
  <!-- 90° Winkel -->
  <path d="M130,185 L140,185 L140,195" fill="none" stroke="#2980b9" stroke-width="1"/>
  <text x="120" y="200" font-size="7" fill="#2980b9">90°</text>
  <text x="155" y="225" text-anchor="middle" font-size="7" fill="#555">Grosser Schritt</text>
  <text x="155" y="234" text-anchor="middle" font-size="7" fill="#555">Knie ca. 90°</text>

  <!-- Phase 2: Rumpfrotation -->
  <rect x="270" y="70" width="200" height="160" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="370" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Phase 2: Rumpfrotation</text>
  <circle cx="370" cy="115" r="10" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="370" y1="125" x2="370" y2="160" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="370" y1="160" x2="345" y2="185" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="345" y1="185" x2="345" y2="210" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="370" y1="160" x2="400" y2="190" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Rotationspfeil -->
  <path d="M355,135 Q340,130 345,145" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="343,145 348,148 349,142" fill="#2980b9"/>
  <path d="M385,135 Q400,130 395,145" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="397,145 392,148 391,142" fill="#2980b9"/>
  <text x="370" y="155" text-anchor="middle" font-size="7" fill="#2980b9">Rotation</text>
  <text x="370" y="225" text-anchor="middle" font-size="7" fill="#555">Kopf + Schultern</text>
  <text x="370" y="234" text-anchor="middle" font-size="7" fill="#555">seitlich drehen</text>

  <!-- Beschreibung -->
  <rect x="40" y="305" width="440" height="65" rx="4" fill="#f5f5f5" stroke="#ddd"/>
  <text x="50" y="322" font-size="9" fill="#333" font-weight="600">Ausführung:</text>
  <text x="50" y="337" font-size="9" fill="#555">Grossen Schritt nach vorne (vorderes Knie 90°). Rücken gerade halten.</text>
  <text x="50" y="352" font-size="9" fill="#555">Bauchmuskeln anspannen. Kopf + Schultern zur Seite und zurück drehen.</text>
  <text x="50" y="367" font-size="9" fill="#555">Hände hinter dem Kopf, Blick nach vorne. Beide Seiten ausführen.</text>
</svg>