<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">Spiel 4 gegen 4 bis 6 gegen 6 mit den Händen. Nicht erlaubt ist jedoch das Prellen.</text><text x="62" y="517" font-size="9.5" fill="#555">Nur Tore mit dem Kopf zählen.</text><text x="62" y="531" font-size="9.5" fill="#555">Zwischenpässe mit dem Kopf im Spielaufbau zählen 1 Punkt, Kopftore 5 Punkte.</text>
