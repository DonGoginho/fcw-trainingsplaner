<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">Der rote Angreifer startet, sprintet um die gelbe Pylone (1) und nimmt den Ball mit (2).</text><text x="62" y="517" font-size="9.5" fill="#555">Der weisse Verteidiger läuft um die rote Pylone (1').</text><text x="62" y="531" font-size="9.5" fill="#555">Rot versucht in den Strafraum zu dribbeln und ein Tor zu erzielen (3).</text><text x="62" y="545" font-size="9.5" fill="#555">Varianten: Richtungswechsel und Sprünge einbauen · Laufstrecke bis 35 m · Lauf- und Schusswinkel variieren.</text>
