<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Inter, sans-serif">
  <title>Big 4 – Bereich 4: Hüfte</title>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Big 4 – Bereich 4: Hüfte</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#555">Körperstabilität · Manual S. 77 · Hüftheber</text>

  <!-- Hintergrund -->
  <rect x="40" y="55" width="440" height="280" rx="6" fill="#e8f5e9" stroke="#4a8f3f" stroke-width="1.5"/>

  <!-- Variante 1: Beidbeinig Hüftheber -->
  <rect x="55" y="70" width="200" height="120" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="155" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#333">V1: Beidbeiniger Hüftheber</text>
  <!-- Figur auf Rücken, Beine angewinkelt, Hüfte gehoben -->
  <line x1="80" y1="155" x2="130" y2="155" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="75" cy="155" r="7" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <!-- Oberkörper schräg nach oben -->
  <line x1="130" y1="155" x2="155" y2="130" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Oberschenkel -->
  <line x1="155" y1="130" x2="175" y2="155" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Unterschenkel -->
  <line x1="175" y1="155" x2="175" y2="168" stroke="#e74c3c" stroke-width="2"/>
  <!-- Gesässboden -->
  <line x1="170" y1="168" x2="180" y2="168" stroke="#333" stroke-width="1"/>
  <!-- Pfeil nach oben (Hüfte) -->
  <line x1="145" y1="140" x2="145" y2="120" stroke="#2980b9" stroke-width="1.5"/>
  <polygon points="142,120 145,114 148,120" fill="#2980b9"/>
  <text x="150" y="112" font-size="7" fill="#2980b9">heben</text>

  <!-- Variante 2: Abwechselnd Fuss anheben -->
  <rect x="270" y="70" width="200" height="120" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="370" y="86" text-anchor="middle" font-size="9" font-weight="700" fill="#333">V2: Fuss anheben</text>
  <line x1="295" y1="155" x2="345" y2="155" stroke="#e74c3c" stroke-width="2.5"/>
  <circle cx="290" cy="155" r="7" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <line x1="345" y1="155" x2="370" y2="130" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Standbein fest -->
  <line x1="370" y1="130" x2="385" y2="155" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="385" y1="155" x2="385" y2="168" stroke="#e74c3c" stroke-width="2"/>
  <!-- Gehobenes Bein -->
  <line x1="370" y1="130" x2="400" y2="115" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="400" y1="115" x2="415" y2="125" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="370" y="180" text-anchor="middle" font-size="7" fill="#555">Abwechselnd einen</text>
  <text x="370" y="189" text-anchor="middle" font-size="7" fill="#555">Fuss anheben</text>

  <!-- Variante 3: Einbeinig Becken heben/senken -->
  <rect x="55" y="200" width="415" height="60" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="65" y="218" font-size="9" font-weight="700" fill="#333">V3: Einbeiniger Hüftheber</text>
  <text x="65" y="233" font-size="9" fill="#555">Aus einbeiniger Ausgangsposition das Becken heben und senken.</text>
  <text x="65" y="248" font-size="9" fill="#555">Rücken gerade halten, Bauch- und Gesässmuskeln anspannen.</text>

  <!-- Coaching-Punkte -->
  <rect x="55" y="270" width="415" height="55" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="65" y="288" font-size="9" fill="#333" font-weight="600">Coaching-Punkte:</text>
  <text x="65" y="303" font-size="9" fill="#555">• Vorstellung: «Du wirst am Bauchnabel nach oben gezogen»</text>
  <text x="65" y="318" font-size="9" fill="#555">• Oberschenkel + Rumpf = eine Linie. Zeitvorgaben statt Wiederholungen.</text>

  <!-- Bereich-Label -->
  <rect x="40" y="345" width="440" height="30" rx="4" fill="#4a8f3f"/>
  <text x="260" y="365" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Hüftstabilität – Gesäss- und Rumpfmuskulatur kräftigen</text>
</svg>