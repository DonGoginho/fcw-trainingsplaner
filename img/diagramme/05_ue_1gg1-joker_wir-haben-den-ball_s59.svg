<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">Der Spieler im Ballbesitz kann mit den Jokern spielen.</text><text x="62" y="517" font-size="9.5" fill="#555">Freies Spielverhalten in der Mitte, 2 Ballkontakte für die Joker.</text><text x="62" y="531" font-size="9.5" fill="#555">Ziel ist, von einem Joker zum anderen zu spielen (= 1 Punkt). Gelingt dies, kommt ein neuer Ball vom Trainer.</text>
