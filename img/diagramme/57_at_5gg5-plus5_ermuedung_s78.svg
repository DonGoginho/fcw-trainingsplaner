<text x="62" y="503" font-size="9.5" fill="#555">Zwei Teams spielen zusammen auf Ballbesitz. Das dritte Team versucht, den Ball zu erobern.</text><text x="62" y="517" font-size="9.5" fill="#555">Sobald dies gelingt, ist die Mannschaft, die den Ball verloren hat, das defensive Team.</text><text x="62" y="531" font-size="9.5" fill="#555">Achtung: Team wechseln, wenn das defensive Team zu lange keinen Ball erobern kann.</text>
