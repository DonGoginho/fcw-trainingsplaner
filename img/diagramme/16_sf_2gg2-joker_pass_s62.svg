<text x="62" y="503" font-size="9.5" fill="#555">Das Team in Ballbesitz versucht mit Hilfe der Aussenspieler ein Tor zu erzielen.</text><text x="62" y="517" font-size="9.5" fill="#555">Die Aussenspieler (Joker, blau) dürfen den Ball maximal zweimal berühren.</text>
