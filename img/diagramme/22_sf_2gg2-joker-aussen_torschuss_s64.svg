<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">2 gegen 2 mit jeweils einem Joker auf jeder Seite.</text><text x="62" y="517" font-size="9.5" fill="#555">In der defensiven Zone ist nur 1 Verteidiger erlaubt.</text><text x="62" y="531" font-size="9.5" fill="#555">Das Ziel besteht darin, möglichst oft zum Torabschluss zu kommen.</text>
