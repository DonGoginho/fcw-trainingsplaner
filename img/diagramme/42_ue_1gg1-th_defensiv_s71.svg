<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">A erhält das Zuspiel von einem seitlichen Spieler B (Verteidigung) (1)</text><text x="62" y="517" font-size="9.5" fill="#555">und bringt einen Spieler C hinter einem Pylonentor (freie Wahl) ins Spiel (2/3).</text><text x="62" y="531" font-size="9.5" fill="#555">Der seitliche Spieler D gegenüber kommt als Verteidiger ins Spiel und verteidigt im 1 gegen 1 das grosse Tor.</text><text x="62" y="545" font-size="9.5" fill="#555">Maximal 1 Umschaltphase spielen.</text>
