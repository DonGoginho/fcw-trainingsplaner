<rect x="50" y="470" width="700" height="82" rx="4" fill="#F5F5F5" stroke="#DDD"/>
<text x="62" y="488" font-size="9.5" font-weight="600" fill="#333">Ablauf:</text>
<text x="62" y="503" font-size="9.5" fill="#555">Fünf Angreifer starten mit einem 5 gegen 1 und versuchen, Tore zu erzielen.</text><text x="62" y="517" font-size="9.5" fill="#555">Nach jedem Tor oder wenn der Ball ins Aus geht, holt ein Angreifer den nächsten Ball.</text><text x="62" y="531" font-size="9.5" fill="#555">Erobern die Verteidiger den Ball, dürfen sie auf die kleinen Tore abschliessen.</text><text x="62" y="545" font-size="9.5" fill="#555">Alle 20 Sekunden kommt ein nächster Verteidiger ins Feld, bis zum 5 gegen 5. 10 Durchgänge/Bälle.</text>
<g transform="translate(60,570)"><line x1="0" y1="0" x2="32" y2="0" stroke="#1F3D0D" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#mA)"/></g><text x="102" y="573" font-size="8.5" fill="#333">Laufweg ohne Ball</text><g transform="translate(201.3,570)"><use href="#pR" x="6" y="8"/></g><text x="217.3" y="573" font-size="8.5" fill="#333">Team Rot</text><g transform="translate(272.5,570)"><use href="#pL" x="6" y="8"/></g><text x="288.5" y="573" font-size="8.5" fill="#333">Team Hellblau</text><g transform="translate(368.2,570)"><use href="#pG" x="6" y="8"/></g><text x="384.2" y="573" font-size="8.5" fill="#333">Torhüter</text><g transform="translate(439.4,570)"><use href="#pC" x="6" y="8"/></g><text x="455.4" y="573" font-size="8.5" fill="#333">Trainer</text>
